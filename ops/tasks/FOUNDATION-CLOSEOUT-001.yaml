acceptance_criteria:
- Existing deterministic merge-gate logic remains fail-closed.
- GitHub receives a kemirix-agent-gate success state only when the deterministic merge
  gate returns MERGE_READY.
- Missing or failing Qwen, GLM, Nemotron, required Kimi, test, CI, task, branch, base,
  or checkpoint conditions cannot produce a successful agent gate.
- Routine GitHub auto-merge cannot bypass the required Kemirix engineering gate once
  repository protection is configured.
- Existing foundation CI and deployment behavior remains functional.
- CURRENT_STATE, PHASE_STATUS, and KNOWN_ISSUES accurately describe the engineering
  state after the automation rehearsal already completed.
- No KMX, Evidence, Rules, source-ingestion, or clinical domain code is introduced
  in this task.
- Relevant automated tests cover the new gate publication behavior.
