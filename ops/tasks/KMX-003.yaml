phase: phase_8
goal: "Implement the robust ING/CD/PROD builders with the strict PROD proof gate and\
  \ stable concurrency-safe ID allocation (owner directive 2026-09-09, Phase 8 / KMX-003).\
  \ src/kmx/allocation.py allocates stable KMX ids with transaction-scoped PostgreSQL\
  \ advisory locking around per-level next-number calculation (no sequences, no new\
  \ permanent tables, ids never random and never renumbered by refreshes). src/kmx/builders.py\
  \ implements: the ingredient builder (RxNorm IN anchors mint/reuse KMX-ING; PIN\
  \ is a precise ingredient that mints its own identity and is never collapsed into\
  \ or duplicated with the base ING, associating to the base only when the official\
  \ relationship is proven and never linking blindly; MIN never mints one fake single\
  \ ingredient \u2014 the builder refuses and the caller resolves constituents and\
  \ represents the combination through CD containment; exact active external identifiers\
  \ always reuse existing KMX); the clinical-drug builder (brand-neutral formulation\
  \ identity: resolved ingredients plus strength/concentration, dose form, release\
  \ and identity-defining route; combination CDs create/reuse one CD with kmx.contains\
  \ CD to each ING member under a deterministic ordinal; immediate-release versus\
  \ extended-release, strength variants and route-specific identities are never collapsed;\
  \ reuse happens only through exact external identifiers, never names; RxNorm branded\
  \ concepts never mint anything here); and the product builder with the strict proof\
  \ gate (approved regulator product lanes only \u2014 S08 ppb_register, S26 ema,\
  \ S27 mhra \u2014 plus an exact regulator product identifier, resolved ING/CD, product\
  \ name and regulator provenance; missing proof fails closed to PRODUCT_IDENTITY_UNPROVEN\
  \ for kmx.mapping_exception; brand or RxNorm SBD is never sufficient; products contain\
  \ their clinical drugs through kmx.contains). Minting is authorized only where the\
  \ lane frozen kmx_levels contract permits the level. Each build call is atomic (registry\
  \ + external identifiers + name index + containment in one transaction). Real RxNorm\
  \ live ingestion may populate only ING/CD in this program; real PROD population\
  \ belongs to Phase 11 regulator lanes."
