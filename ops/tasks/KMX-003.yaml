acceptance_criteria:
- src/kmx/allocation.py allocates the next stable KMX id per level using a transaction-scoped
  advisory lock and the current maximum numeric suffix; no random ids, no renumbering
  across refreshes, no new permanent table, and concurrent allocations in separate
  transactions never collide.
- The repository gains the write surface the builders need (insert KMX row, insert
  external identifier, insert name index entry, insert containment with ordinal and
  relationship type) while the resolver stays read-only and psycopg stays lazily imported.
- "The ingredient builder reuses via exact active external identifiers, mints KMX-ING\
  \ only when the lane kmx_levels contract authorizes the ingredient level, refuses\
  \ MIN concepts outright, mints PINs as their own precise identities, and associates\
  \ a PIN to its base ING through kmx.contains only when the official relationship\
  \ is proven \u2014 never blindly, never by duplication or collapse."
- The clinical-drug builder mints/reuses brand-neutral formulation identities from
  resolved ingredients plus strength/concentration, dose form, release and identity-defining
  route; combination CDs create one CD containing each ingredient member with deterministic
  ordinals; distinct strengths, release characteristics, dose forms and routes never
  collapse; reuse happens only through exact external identifiers, never names; every
  build call is atomic across registry, external identifiers, name index and containment.
- 'The product builder enforces the strict proof gate: only the approved regulator
  product lanes (ppb_register, ema, mhra) with an exact regulator product identifier,
  resolved clinical drug(s), product name and regulator provenance may create KMX-PROD;
  every other source, brand or RxNorm SBD fails closed to PRODUCT_IDENTITY_UNPROVEN
  for kmx.mapping_exception; products contain their clinical drugs through kmx.contains.'
- 'Tests cover: ING reuse; proven and ambiguous PIN/base cases; MIN refusal; SCD-to-CD
  construction; release/strength/form distinction; combination containment with deterministic
  ordinals; duplicate RXCUI reuse; SBD never mints PROD; brand never mints PROD; product
  builder rejects wrong source and missing regulator identifier; a regulator fixture
  creates and reuses PROD; unauthorized lane minting refusal; concurrent allocation
  (CI-gated against the isolated hosted CI PostgreSQL only) and refresh idempotency
  without renumbering.'
- Only allowed paths change; no Evidence or Rule implementation, no source adapters,
  no live ingestion, no new dependencies.
