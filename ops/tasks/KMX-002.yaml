phase: phase_7
goal: 'Implement the deterministic KMX repository and resolver (owner directive 2026-09-09,
  Phase 7 / KMX-002): src/kmx/normalizer.py with conservative identity normalization
  (Unicode NFKC, case folding and whitespace collapse only; strength, concentration,
  route, release type, stereochemistry, salts/isomers, combination ingredients and
  all punctuation are treated as identity-bearing and never stripped or collapsed);
  src/kmx/repository.py with the psycopg-backed repository over the five frozen tables
  (active external-identifier bindings, level-filtered normalized-name lookup, mapping-exception
  recording with full provenance); src/kmx/resolver.py implementing the frozen deterministic
  algorithm exactly: collect exact identifiers, look up active external bindings,
  any identifier disagreement or cross-identifier disagreement fails to mapping_exception
  IDENTIFIER_CONFLICT, exactly one KMX resolves, more than one distinct KMX from identifiers
  fails to mapping_exception MULTIPLE_MATCHES where a single identifier itself binds
  several identities, no exact identifier falls back to conservative exact normalized-identity
  lookup only where the source contract permits it, one unique structural candidate
  resolves, none fails to mapping_exception NO_MATCH, multiple or ambiguous formulation
  candidates fail to mapping_exception FORMULATION_AMBIGUITY, and a product-level
  request from a lane that is not an approved regulator product creator fails to mapping_exception
  PRODUCT_IDENTITY_UNPROVEN. No LLM or name-similarity identity guesses anywhere;
  zero external matches may only lead to minting by an authorized lane in a later
  phase.'
