acceptance_criteria:
- 'src/kmx/normalizer.py implements only conservative normalization: Unicode NFKC,
  case folding and whitespace collapsing/trimming; every other token class (strength,
  concentration, route, release type, stereochemistry, salts, isomers, combination
  ingredients, punctuation) is preserved as identity-bearing, and the module documents
  this conservatism.'
- 'src/kmx/repository.py provides the psycopg-backed repository over the frozen five-table
  schema: active external-identifier binding lookup by (identifier_system, identifier_value),
  level-filtered normalized-name candidate lookup, KMX row fetch, and mapping-exception
  recording with lane/source/version/record provenance, the frozen reason codes, the
  normalized input and candidate KMX ids; psycopg is imported lazily so the domain
  packages stay import-clean.'
- src/kmx/resolver.py implements the frozen deterministic algorithm exactly as specified
  in the goal, returns a Resolved outcome (kmx id and level) or a MappingExceptionOutcome
  (reason code and candidates), performs no writes, makes no network or LLM calls,
  and enforces the PRODUCT_IDENTITY_UNPROVEN boundary for product-level requests from
  non-approved regulator product lanes (S08/S26/S27 only).
- 'Tests cover: exact RXCUI resolution; UNII fixture resolution; zero match; multiple
  matches from one identifier binding several KMX; identifier disagreement across
  different identifiers pointing at different KMX; ambiguous strength/form candidates
  through the name fallback; combination identity containment untouched by the resolver;
  product identity unproven for a non-regulator lane; conservative normalization behavior
  (case, whitespace, NFKC folding; strength and punctuation preserved); no-AI-path
  assertion; and repository behavior against fakes plus a CI-gated integration test
  against the isolated hosted CI PostgreSQL only when KEMIRIX_CI_POSTGRES=1 and GITHUB_ACTIONS=true.'
- Only allowed paths change; no Evidence or Rule implementation, no builders or minting
  (Phase 8), no source adapters (Phase 9/10), no new dependencies, and the frozen
  keys/manifests/contracts are untouched.
