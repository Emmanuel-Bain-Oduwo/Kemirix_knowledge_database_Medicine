acceptance_criteria:
- scripts/runtime.py deploys executable-migration releases by executing the ready
  prefix against the development PostgreSQL through psql using only the operator-provisioned
  env file (DATABASE_URL parsed in-process into PG* variables, never on command lines
  or logs), verifying PostgreSQL 17, applying from zero in a single transaction when
  the domain schemas are absent, and verifying the already-applied table inventory
  idempotently when they exist; missing or unsafe env file keeps the documented fail-closed
  refusal.
- The execution derives the ready prefix and expected tables from the release itself
  (release venv executing scripts/migration_gate.py plan plus parsing the CREATE TABLE
  statements of the ready files), never from hardcoded lists.
- src/agents/models.py gains an explicit opt-in contract field owner_approved_skill_update
  (default false); only phase_0 FOUNDATION bootstrap tasks with that flag may list
  SKILL.md in allowed_paths and authorize SKILL.md writes; every other task keeps
  the full protection, and tests prove both the rejection without the flag and the
  allowance with it.
- docs/CI_CD.md and docs/AGENT_COORDINATION.md document the development migration
  execution (credential contract, fail-closed behavior) and the SKILL.md owner-approved
  update mechanism.
- Tests cover the new runtime migration execution (absent env file refuses, from-zero
  apply, idempotent verification, foreign/partial state fails closed) and the models
  SKILL ownership rules; CI stays green.
required_tests:
- foundation
