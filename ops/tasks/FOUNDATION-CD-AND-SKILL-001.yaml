phase: phase_0
goal: Implement the separately approved development migration execution so the Deploy
  development workflow can deliver executable-migration releases (the current hook
  refuses them, leaving the CD pipeline red after KMX-SCHEMA-001), and add the explicit
  owner-approved task mechanism that allows a phase_0 governance task to synchronize
  the repository SKILL.md with the owner-approved blueprint. The development database
  credentials stay outside Git in an operator-provisioned 0600 env file (/srv/kemirix/secrets/dev-postgres.env);
  the deploy path fails closed when the file is absent, preserving the previous safety
  semantics. No domain code, migrations or CI workflow changes.
