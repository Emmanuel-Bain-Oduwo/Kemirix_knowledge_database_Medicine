acceptance_criteria:
- src/sources/http.py implements the shared HTTP client over httpx with HTTPS, source-specific
  User-Agent, connect/read timeouts, streamed response bodies written directly to
  the caller sink, bounded exponential retries with jitter, Retry-After (seconds and
  HTTP-date, capped), per-source rate limiting (internal conservative default 2 requests/second/source,
  max concurrency 2/source, bounded attempts, default 5) and retry attempt metadata;
  NLM hosts are hard-capped at or below the published 20 requests/second/IP ceiling
  while Kemirix defaults stay far lower.
- 'The failure classification is frozen and fail-closed: 429 retries honoring Retry-After
  or bounded backoff+jitter; 408 and transient network errors retry bounded; 500/502/503/504
  retry bounded; deterministic 4xx (including 400/401/403/404) fails immediately with
  no blind retry; exhausted retries fail with the retry_exhausted class; every error
  carries attempts and a failure class without secrets.'
- 'src/sources/acquisition.py implements the non-negotiable parser boundary: network
  bytes stream to a temp file, hash, immutable Object Storage upload via put_immutable,
  manifest written LAST through the frozen hardened model, and the parser reads the
  stored original from the vault; a parser failure leaves the raw original and manifest
  fully preserved; operator-provided local files (manual/bulk lanes) follow the same
  hash-then-vault path.'
- 'src/sources/results.py provides the typed AcquisitionResult: lane/source/ version/record
  identity, started/finished timestamps, status, HTTP status where relevant, attempts,
  failure class and retryable flag, artifact keys and manifest reference; extra fields
  forbidden; no secrets.'
- src/sources/base.py declares the frozen SourceAdapter concept with acquire, save_original
  and verify_hash real through the shared pieces, iter_source_items reading stored
  originals, and resolve_kmx, create_source_blocks and build_full_evidence raising
  explicit not-implemented boundary errors (no KMX, no Evidence, no Rule logic).
- The storage client gains only a fully tested streaming download_to(object_key, destination)
  read API; nothing else in src/storage changes.
- "Tests cover: 200 success with raw-before-parse proven from the store, 429 with\
  \ Retry-After then success, 5xx retry then success, deterministic 404 fails with\
  \ one attempt, timeout, retry exhaustion, per-source rate limiter spacing, User-Agent\
  \ header, result model validation, parser failure preserving the raw original, adapter\
  \ boundary methods refusing KMX/Evidence work, local-file acquisition, and download_to\
  \ streaming \u2014 all offline with mocked transports and fake stores; no live-source\
  \ ingestion."
- Only allowed paths change; no lane adapters, no new dependencies, no Evidence or
  Rule implementation, no KMX resolver, no parsers beyond the declared boundary.
