phase: phase_4
goal: "Build the shared source acquisition framework and parser boundary (owner directive\
  \ 2026-09-09, Phase 4 / INGESTION-CORE-001) around the existing storage vault client:\
  \ src/sources/http.py (https-only httpx client with source-specific User-Agent,\
  \ connect/read timeouts, streamed bodies, bounded exponential retries with jitter,\
  \ Retry-After support, per-source rate limiting with an internal conservative default\
  \ of 2 requests/second/source and max concurrency 2, NLM hosts hard-capped at or\
  \ below the published 20 requests/second/IP ceiling); src/sources/acquisition.py\
  \ (network bytes streamed to temp, hash, immutable Object Storage upload, manifest\
  \ LAST, then the parser reads the stored original \u2014 parser failure preserves\
  \ the raw; also operator-provided local file acquisition for manual/bulk lanes);\
  \ src/sources/results.py (typed AcquisitionResult with lane/source/version/ record,\
  \ timestamps, status, HTTP status where relevant, attempts, failure class/retryable,\
  \ artifact and manifest references, no secrets); src/sources/base.py (the frozen\
  \ SourceAdapter concept: acquire, save_original, verify_hash and iter_source_items\
  \ real through the shared pieces; resolve_kmx, create_source_blocks and build_full_evidence\
  \ remain explicit not-implemented phase boundaries). The storage client gains only\
  \ a fully tested streaming download_to read API so parsers read stored originals.\
  \ HTTP classification is frozen: 429 retries honoring Retry-After, 408 and transient\
  \ network errors retry bounded, 500/502/503/504 retry bounded, deterministic 4xx\
  \ fails immediately without blind retry, success preserves the raw original first\
  \ and only then parses the stored copy. No lane adapters, no live-source ingestion,\
  \ no Rule logic, no Evidence, no parsers beyond the boundary."
