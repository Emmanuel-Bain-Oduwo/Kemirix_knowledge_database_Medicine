goal: 'Build the production RxNorm adapter, RRF parser and KMX loader (owner directive
  2026-09-09, Phase 9 / S01-RXNORM-001) fully with fixtures and offline tests; the
  one authorized live download is deferred until after Phase 10 merges. src/sources/rxnorm/release.py
  implements official release discovery (uts-ws.nlm.nih.gov/releases?releaseType=rxnorm-full-monthly-release&current=true,
  verified live JSON shape) and pinned-release verification that fails closed with
  PINNED_RELEASE_MISMATCH on any drift; the program pin is the RxNorm full monthly
  release of 2026-09-08, file RxNorm_full_09082026.zip, official MD5 34dd95b0ae128fb81bc68166944514f2,
  official URL https://download.nlm.nih.gov/umls/kss/rxnorm/RxNorm_full_09082026.zip,
  and RxNorm_full_current.zip is never used. src/sources/rxnorm/download.py builds
  the authenticated UTS download URL (apiKey as query parameter from the UTS_API_KEY
  secret environment, never logged) on top of the shared Phase 4 HTTP client with
  the NLM ceiling respected, and verifies the official pinned MD5 before computing
  the canonical SHA-256. src/sources/rxnorm/rrf.py streams pipe-delimited UTF-8 RRF
  members located by basename with the official column layouts and SAB=RXNORM plus
  SUPPRESS filters. src/sources/rxnorm/loader.py runs the deterministic bulk passes
  over the stored original: A) canonical IN anchors mint/reuse KMX-ING; B) PINs mint
  their own precise identities and associate to the base ING through the officially
  proven form_of relation only; C) SCD structural identities mint/reuse brand-neutral
  KMX-CD; D) CD to ING containment with deterministic ordinals (SCD consists_of SCDC
  has_ingredient IN, plus SCD has_ingredients MIN has_part IN/PIN for combinations);
  E) exact RXCUI external identifiers; F) SBD brand aliases projected onto existing
  CDs only through the proven tradename_of relation; G) unresolved structures record
  mapping exceptions. Zero KMX-PROD from RxNorm. No parallel RxNorm mirror: the raw
  release stays in Object Storage, normalized KMX goes to PostgreSQL.'
