acceptance_criteria:
- src/sources/rxnorm/release.py parses the verified live discovery payload shape (JSON
  list with fileName, releaseVersion, releaseDate, downloadUrl, releaseType, product,
  current), requires exactly one current RxNorm full monthly release, validates type/product/filename,
  and pins the release into acquisition metadata before download; verify_pinned fails
  closed with PINNED_RELEASE_MISMATCH on filename, version or URL drift and never
  silently ingests a newer release; the pinned constants match the directive exactly.
- src/sources/rxnorm/download.py builds the authenticated download URL with the UTS_API_KEY
  environment credential only, never logs the key or the full URL, streams through
  the shared Phase 4 HTTP client (NLM ceiling respected, honor 429), and verifies
  the official pinned MD5 before the canonical SHA-256 is computed.
- src/sources/rxnorm/rrf.py streams RRF members located by basename (case-insensitive,
  any ZIP directory prefix) with the official RXNCONSO (18 columns), RXNREL (16 columns)
  and RXNSAT (13 columns) layouts, splitting on pipes with UTF-8 decoding and SAB/SUPPRESS
  filtering; no unbounded in-memory buffering.
- 'src/sources/rxnorm/loader.py implements the deterministic passes with the official
  relation directions (RXCUI2 RELA RXCUI1): IN anchors; PIN identities with form_of-proven
  base association; SCD clinical drugs whose ingredient members come from consists_of/has_ingredient
  plus has_ingredients/has_part; deterministic ordinals; exact RXCUI external identifiers;
  SBD aliases only through proven tradename_of; mapping exceptions for unresolved
  structures; suppressibility respected (only SUPPRESS=N rows); the full-release versus
  prescribable (CVF=4096) distinction tracked in statistics; zero KMX-PROD.'
- 'src/sources/rxnorm/adapter.py wires the full pinned flow (discovery, pin verification,
  authenticated download, MD5 verification, SHA-256, immutable vault upload, manifest
  last, parse the stored copy, load KMX) for the final live execution, and an offline
  integration test proves the whole flow end-to-end with fixtures: fake HTTP discovery
  and download, a realistic synthetic RRF ZIP, the fake vault and the real loader
  against the fake repository/builder stack.'
- Tests cover release parsing and pin drift, download URL secret safety, MD5 verification,
  RRF parsing (nested member location, filters), every loader pass (IN, PIN proven
  and unproven, single and combination SCD with ordinals, aliases, suppressibility,
  unresolved-structure exceptions), rerun idempotency (second load reuses everything),
  zero PROD, statistics, and the adapter end-to-end flow including PINNED_RELEASE_MISMATCH.
  No live network access in any test.
- Only allowed paths change; no Evidence or Rule implementation, no other lane adapters,
  no changes to the frozen kmx/storage/database contracts beyond calling them.
