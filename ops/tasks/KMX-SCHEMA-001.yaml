acceptance_criteria:
- migrations/001_kmx.sql contains reviewed executable PostgreSQL 17 DDL creating the
  kmx schema with exactly the five tables registry, contains, external_identifier,
  name_index and mapping_exception from the frozen SKILL.md and config/database.yaml
  inventory, with primary keys, foreign keys, level and KMX-ID constraints (ING/CD/PROD),
  unique external-identifier binding per source, and combination-safe containment.
- kmx.registry enforces KMX id format (KMX-ING-/KMX-CD-/KMX-PROD- prefix with numeric
  suffix), a level matching the prefix, and stable preferred names; kmx.contains supports
  multiple ingredient parents for combination CDs without cycles.
- kmx.mapping_exception preserves unresolved or ambiguous identity conflicts with
  review status; kmx.name_index is a lookup aid only and never mints identity.
- config/migration_suite.yaml promotes migrations/001_kmx.sql to executable while
  002/003 remain pending, so the CI migration gate executes only the ready prefix
  from an empty database and fails closed on any inventory mismatch.
- Automated tests cover the migration-suite declaration logic, DDL structure expectations
  (tables, columns, constraints) against the shipped SQL, and the KMX ID format rules
  without requiring a live database.
- No data loading, no evidence/rules schema changes, no source adapter code, no engineering-system
  (src/agents, opencode.json) changes are introduced.
