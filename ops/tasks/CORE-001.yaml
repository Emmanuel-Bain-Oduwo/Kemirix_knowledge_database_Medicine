acceptance_criteria:
- pyproject.toml packages include src/agents plus the six domain packages; every domain
  package imports cleanly and packaging is no longer limited to src/agents.
- 'Shared core types exist exactly once: KmxLevel and validated Kmx-IDs in kmx.models,
  EvidenceCategory (exactly 24, follow_up excluded) in evidence.categories, EvidenceStatus
  plus truth/join level semantics in evidence.models (reusing the KMX level enum,
  never duplicating it), RuleOutcome (MATCH/NO_MATCH/CANNOT_FULLY_EVALUATE) in rules.models,
  and acquisition/rights/parse statuses in storage.models; lane IDs (S01-S27) and
  source slugs are validated as distinct identifier kinds.'
- 'Deterministic config loading: database config (exact 5+6+3 inventory), object storage
  + storage contract (layout, controlled values, manifest fields), categories, jurisdictions,
  source schema and all 27 source configs load through one common interface with fail-closed
  validation (invalid slug, missing field, duplicate lane or source ID, unknown category,
  unknown jurisdiction, unsupported KMX level all raise).'
- 'Small shared error hierarchy: KemirixError base with configuration, identity resolution
  and mapping exception boundary errors in kmx.exceptions, plus storage contract,
  database contract and source contract errors in their packages; no large framework.'
- The source registry foundation loads all 27 lanes and exposes lane_id, source_id,
  acquisition_mode, role, KMX capability, Evidence role, Rule policy and rights/version
  policy from the frozen configs; it is a common registry, not a DailyMed adapter.
- 'Domain import boundaries stay clean: no boto3, psycopg, HTTP clients or parsers
  are imported; unit tests require no external services.'
- 'tests/test_core.py proves: every domain package imports; packaging includes domain
  modules; all 27 source configs validate through the common interface; shared enums
  match the frozen contracts; KMX IDs validate (and reject KMX-PRES-style ids); invalid
  configs fail closed; duplicate lane/source IDs fail; categories are exactly 24;
  no unsupported KMX level exists; config models serialize and parse deterministically.'
required_tests:
- foundation
