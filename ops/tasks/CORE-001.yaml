goal: 'Make the domain Python foundation production-ready and importable per the owner-approved
  2026-09-08 execution book section 9 (Phase 2 - CORE-001): fix pyproject packaging
  to include the domain packages (src/kmx, src/evidence, src/rules, src/storage, src/database,
  src/sources) instead of src/agents only; implement the minimal shared core types
  (KMX level, KMX ID validation, lane ID, source ID, Evidence category, Evidence status,
  truth and join levels, source role, rights status, parse status, Rule evaluation
  outcome, jurisdiction) without duplicating enums across modules; implement deterministic
  loading and validation for the database config, object storage config, categories,
  jurisdictions, source schema and all 27 source configs through one common interface
  that fails closed on invalid configuration; add the small shared error hierarchy
  (configuration, identity resolution, mapping exception boundary, storage contract,
  database contract, source contract); and provide the common source registry foundation
  exposing lane_id, source_id, acquisition_mode, role, KMX capability, Evidence role,
  Rule role and rights/version policy for all 27 lanes. No real S3 uploads, no PostgreSQL
  pool, no HTTP acquisition, no parsers, no source loading, no Evidence extraction,
  no Rule compilation.'
