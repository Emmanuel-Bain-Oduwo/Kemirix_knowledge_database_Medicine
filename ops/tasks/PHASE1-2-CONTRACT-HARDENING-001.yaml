- src/storage/manifest.py gains a manifest-level model validator that binds each artifact
  object_key to exactly build_object_key(manifest.source_id, manifest.source_version,
  manifest.source_record_key, artifact.original_filename); mismatch fails closed and
  is never silently rewritten; existing sha256/byte-size/unknown-field/controlled-value
  validation is preserved.
- config/rule_contract.yaml freezes the complete structural field inventories for
  clinical_rule (rule_id, target_kmx_id, target_level, category, jurisdiction, patient_trigger,
  required_patient_data, verdict, verdict_reason, severity, severity_reason, immediate_action,
  action_reason, recommendation, recommendation_reason, alternatives, risk_factors,
  monitoring, follow_up, status, created_at, updated_at, reviewed_at, reviewed_by),
  rule_evidence (rule_id, evidence_id, support_role, supports_fields, ordinal) and
  rule_test (test_id, rule_id, test_name, patient_fixture, expected_outcome, expected_decision_fields,
  active), plus the exact three outcomes with all-trigger MATCH, missing-data CANNOT_FULLY_EVALUATE
  and wrong-formulation NO_MATCH semantics, immutable Evidence inheritance and the
  no-remapping invariant.
- config/rule_contract.yaml gains one canonical frozen source_rule_policies map for
  S01-S27 with each lane exact approved rule policy; tests enforce every config against
  it exactly (S06 rules true passes, "disabled"/"false_initially"/arbitrary strings
  fail), and the SourceConfig model rejects arbitrary rule-policy strings on non-primary
  lanes (only false or false_initially allowed).
- 'docs/OBJECT_STORAGE.md matches config/storage_contract.yaml, src/storage/keys.py
  and SKILL.md: five-segment layout, __release__ bulk examples, full manifest field
  list, lane_id manifest-only / source_id in key, upload semantics and the PostgreSQL
  authority boundary.'
- migrations/002_evidence.sql placeholder comments list exactly the six planned Evidence
  tables (source, source_version, source_block, block_subject, clinical_evidence,
  evidence_support), remain comment-only non-executable, and migration_suite.yaml
  still declares it pending.
- 'The forbidden-manifest-field check inspects mapping keys recursively and exactly
  instead of substring-scanning values: original_filename secretin.xml passes, api_key/password/secret/presigned_url
  fields fail (both the test helper and the production Manifest with extra=forbid).'
- 'Regression tests cover the full directive checklist: manifest lineage (exact pass,
  wrong source/version/record/filename fail, secretin.xml allowed, credential fields
  fail), rule contract inventories and semantics, exact S01-S27 authority policies
  with negative drift detection, storage docs consistency, and the six-table non-executable
  Evidence placeholder.'
- No real Evidence or Rule DDL is implemented, no source ingestion, no S3 client,
  no PostgreSQL pool, no parsers, no Phase 3 work; only the allowed paths change.
