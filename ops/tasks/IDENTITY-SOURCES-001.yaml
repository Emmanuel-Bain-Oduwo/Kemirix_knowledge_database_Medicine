goal: 'Implement production-ready acquisition/parser/resolution code with fixtures
  for the S02-S05 identity-enrichment lanes (owner directive 2026-09-09, Phase 10
  / IDENTITY-SOURCES-001). NO live downloads for any of these lanes in this program;
  only the pinned RxNorm load (already authorized) runs live after this phase. S02
  athena_extension: operator- provided OMOP Athena ZIP validation/preservation (required
  CONCEPT, CONCEPT_RELATIONSHIP, CONCEPT_SYNONYM, DRUG_STRENGTH, VOCABULARY members),
  streaming CSV concept parsing with exact vocabulary/version/license recording, and
  mapping of verified OMOP/RxNorm Extension identifiers into EXISTING KMX only (RxCUI
  concept codes resolve to existing identities and attach OMOP external identifiers;
  no parallel universe is minted). S03 gsrs_unii: bulk zipped JSON snapshot substance
  parsing (UNII, preferred name, substance class, parent relationships), exact UNII-to-
  KMX-ING resolution (minting only where the lane contract authorizes the ingredient
  level), base/salt parent relationships preserved through precise-ingredient containment
  and never merged by name, plus the openFDA substance canary verification client
  (api.fda.gov, conservative 3 rps, honor 429, official limits respected). S04 chebi_unichem:
  ChEBI FULL JSON compound parsing (identifiers, synonyms, curated cross-references,
  InChI/InChIKey, ontology parents), exact curated/structure bridge to KMX-ING with
  stereochemistry/isotope/salt distinctions preserved, and the UniChem REST client
  (compounds/connectivity/sources endpoints, conservative 2 rps default with no invented
  ceilings, honor 429) where connectivity similarity never silently becomes exact
  identity. S05 medrt: dynamic paired-release discovery from the official archive
  index (newest Core_MEDRT_<release>_XML.zip plus matching Accessory, no hardcoded
  stale dates), MED-RT XML association parsing, and attachment to existing KMX only
  through exact RxNorm crosswalks with no prescribing authority.'
