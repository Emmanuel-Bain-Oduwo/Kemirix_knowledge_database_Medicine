acceptance_criteria:
- 'S02: the OMOP Athena module validates operator-provided ZIPs (all five required
  CSV members present, readable), streams concept rows with exact vocabulary/version/license
  recording, resolves RxNorm-vocabulary concept codes (RXCUI) to existing KMX and
  attaches OMOP_CONCEPT_ID external identifiers; it never mints identities and records
  per-row outcomes.'
- 'S03: the GSRS/UNII module parses the bulk zipped JSON substance snapshot (UNII,
  preferred name, substance class, parents), resolves exact UNII to KMX-ING (minting
  only under the lane authorization), preserves base/salt parent relationships through
  precise-ingredient containment without name-based merging, and provides the openFDA
  canary client with a conservative 3 rps rate, 429/Retry-After honoring and the official
  limit documentation; no live calls in tests.'
- "S04: the ChEBI/UniChem module parses ChEBI FULL JSON compounds (identifier, name,\
  \ InChIKey, synonyms, curated cross-references, ontology parents), bridges to KMX-ING\
  \ through exact curated cross-references only (stereochemistry, isotope and salt\
  \ distinctions preserved \u2014 connectivity similarity is never identity), and\
  \ provides the UniChem REST client with the conservative 2 rps internal default\
  \ and 429 honoring; no live calls in tests."
- 'S05: the MED-RT module discovers paired releases dynamically from the official
  archive index (newest Core_MEDRT_*_XML.zip plus matching Accessory; no hardcoded
  release dates), parses concept associations from the core XML, and attaches supporting
  metadata to existing KMX only through exact RxNorm crosswalks with no prescribing
  authority.'
- "Tests cover every lane with realistic offline fixtures: OMOP CSV archive (enrichment\
  \ into existing KMX, missing-member rejection), GSRS JSON snapshot (UNII resolution,\
  \ salt/base preservation, no name merging), ChEBI JSON (curated bridge, stereochemistry\
  \ preservation, connectivity non-identity), MED-RT (paired-release discovery from\
  \ a fixture index, association parsing, crosswalk attachment), and all three API\
  \ clients (URL construction, rate defaults, secret-free errors) \u2014 all offline."
- Only allowed paths change; no Evidence or Rule implementation, no live bulk downloads
  for S02-S05, no changes to the frozen kmx/storage/database contracts beyond calling
  them.
