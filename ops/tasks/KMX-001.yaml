acceptance_criteria:
- 'The audit verifies against live main and the live development database: exactly
  five kmx tables (registry, contains, external_identifier, name_index, mapping_exception);
  legal levels exactly ingredient/clinical_drug/product; KMX ID formats exactly KMX-ING/KMX-CD/KMX-PROD
  six-digit with prefix bound to level; no KMX-PRES; container/member containment
  with both-way foreign keys and no self-containment; external identifiers recordable
  with conflicts (no global source+value unique) so disagreements fail closed into
  mapping_exception; the name index never mints identity; mapping exception reason
  codes exactly NO_MATCH, MULTIPLE_MATCHES, IDENTIFIER_CONFLICT, FORMULATION_AMBIGUITY
  and PRODUCT_IDENTITY_UNPROVEN with full provenance and review-state constraints;
  no cross-schema dependency on evidence/rules.'
- 'The reconciliation conclusion is recorded: Phase 6 KMX-001 is already materially
  satisfied by the earlier approved KMX-SCHEMA-001 (merged at b36b909, PR 6) and the
  applied development schema; the milestone is proven through DATABASE-001 (migration
  runner from-zero apply, idempotent verification, prefix upgrade paths and the CI
  migration-from-zero gate all exercise the real DDL), so no duplicate or rewritten
  schema and no new code change is produced by this task.'
- Any non-blocking observation (for example a potential resolver lookup index on external
  identifiers) is recorded honestly for a future separately approved migration rather
  than editing the already-applied historical 001_kmx.sql in this program.
- No Evidence or Rule DDL, no KMX resolver or builder implementation (Phase 7/8 scope),
  no source work, and no already-applied migration is edited.
