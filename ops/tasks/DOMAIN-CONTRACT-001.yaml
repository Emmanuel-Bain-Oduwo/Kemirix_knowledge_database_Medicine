goal: 'Freeze the universal domain contracts for all 27 approved source lanes per
  the owner-approved 2026-09-08 blueprints (SKILL NEW(3) v5.0 and the knowledge foundation
  execution book): the complete database inventory (5 KMX + 6 Evidence + 3 Rule tables),
  the Object Storage object-key and manifest contract (immutable/idempotent upload,
  collision rejection, manifest last, original-byte preservation, rights status, credential
  exclusion), the KMX ING/CD/PROD contract, join_level vs truth_level separation,
  the 24 shared categories, the Evidence contract (source/version/KMX/category/jurisdiction
  specificity, evidence_support, block_subject, controlled statuses, no model clinical
  approval), the Rule contract (eligibility, immutable inheritance, exact outcomes
  MATCH/NO_MATCH/CANNOT_FULLY_EVALUATE) and the source authority roles (S07 duplicate
  projection, S11 gated, S16 sourcing exclusion, S20 dynamic ChEMBL release, S16-S24
  supporting lanes, S26/S27 regulatory primary). Contracts are frozen as validated
  configuration plus automated contract tests. No source parsers, no data loading,
  no Evidence/Rules DDL.'
