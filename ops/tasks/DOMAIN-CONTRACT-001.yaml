acceptance_criteria:
- 'config/database.yaml inventories exactly the 14 approved tables: five kmx (registry,
  contains, external_identifier, name_index, mapping_exception), six evidence (source,
  source_version, source_block, block_subject, clinical_evidence, evidence_support)
  and three rules (clinical_rule, rule_evidence, rule_test).'
- config/storage_contract.yaml freezes the approved object-key pattern <source_id>/<source_version>/<source_record_key>/original/,
  the full manifest contract (schema_version, lane_id, source_id, source_version,
  source_record_key, acquisition_mode, fetched_at, upstream_published_at, adapter_git_sha,
  rights_status, parse_status, artifacts with artifact_type, original_filename, content_type,
  byte_size, object_key, sha256), the controlled values (acquisition modes, rights
  statuses, parse statuses), immutable/idempotent upload semantics, collision rejection,
  manifest-last behavior, original-byte preservation and the exclusion of credentials
  and presigned URLs from manifests; config/object_storage.yaml layout matches the
  frozen pattern.
- config/evidence_contract.yaml freezes the Evidence statuses (draft, approved, stale,
  retired), evidence_support (evidence_id, block_id, support_role, ordinal), block_subject
  (block_id, join_kmx_id, join_level, resolver_method, mapping_status), the separate
  join_level and truth_level fields with their ING/CD/PROD value set and distinct
  semantics, source/version/KMX/category/jurisdiction specificity, no-silent-blending
  and no-model-clinical-approval rules.
- config/rule_contract.yaml freezes the exact outcomes (MATCH, NO_MATCH, CANNOT_FULLY_EVALUATE),
  the missing-required-data and wrong-formulation semantics, the immutable inheritance
  (target_kmx_id, target_level, category, jurisdiction from approved Evidence), rule
  eligibility (approved, eligible, executable Evidence from primary regulatory/guideline
  lanes only) and the source authority invariants (S07 duplicate projection is not
  an independent vote; S11 authority-gated; S16 excludes supplier/vendor sourcing;
  S20 resolves the current approved ChEMBL release dynamically; S16-S24 supporting
  lanes never independently create prescribing authority; S26/S27 are primary when
  Evidence is executable; duplicate projections are not independent clinical votes).
- docs/SOURCE_MATRIX.md reflects the frozen 27-lane registry with stable source slugs
  and authority roles.
- 'tests/test_domain_contracts.py proves at minimum: all 27 lanes exist with unique
  lane IDs and unique source IDs; lane_id and source_id semantics are distinct (S01-S27
  lanes vs slug identifiers); all source configs load and match the owner-approved
  registry; only ING/CD/PROD exist; exactly 24 categories with follow_up excluded;
  the DB inventory is exactly 5+6+3; join_level and truth_level remain distinct; the
  storage manifest validates against the frozen contract; the object-key contract
  validates; the KMX migration has no Evidence dependency; controlled statuses validate;
  source authority roles validate; forbidden architecture additions are absent.'
