acceptance_criteria:
- src/database/connection.py connects through psycopg (imported lazily so the domain
  packages stay import-clean) with credentials only from parameters, a URL or PG*
  environment variables, secure sslmodes required by default (require/verify-ca/verify-full),
  an explicit allow_insecure escape used only by isolated CI tests, no password-bearing
  DSN in any error or string, a healthcheck proving PostgreSQL 17, and typed DatabaseConnectionError
  wrapping that never leaks credential material.
- 'src/database/transaction.py provides the small transaction context helper: BEGIN,
  yield, COMMIT; exception triggers ROLLBACK and re-raise; nested callers get deterministic
  atomicity for identity creation plus external-ID/containment/name links.'
- 'src/database/migrations.py holds the single canonical migration logic: contains_sql,
  plan (readiness from config/migration_suite.yaml with the exact inventory/order/prefix/content
  validation) and expected table extraction; the apply_or_verify runner executes only
  the reviewed ready prefix in deterministic order inside one transaction, applies
  from zero on a clean PostgreSQL 17, verifies an already-applied prefix idempotently,
  performs prefix-based multi-migration upgrades, and fails closed on partial, foreign
  or unexpected state without ever silently skipping a required executable migration;
  no migration-history table is added to the frozen 5+6+3 inventory.'
- scripts/migration_gate.py delegates plan/contains_sql to the library with identical
  CLI behavior for the CI PostgreSQL 17 gate, and scripts/runtime.py stays standard-library-only
  while executing development migrations through the release venv runner with operator-provisioned
  PG* environment credentials, preserving the PostgreSQL 17 check, from-zero single
  transaction apply, idempotent prefix verification, empty-database refusal and every
  other fail-closed semantic while unlocking multi-migration upgrades.
- "Tests cover: URL/env credential parsing and secret safety (no password in errors\
  \ or representations), secure sslmode enforcement, healthcheck, transaction commit\
  \ and rollback, migration order and ready-vs-pending planning, expected-table extraction,\
  \ from-zero apply, idempotent verification, prefix upgrade, foreign/partial state\
  \ failure and migration rollback \u2014 unit tests against fakes plus CI-gated integration\
  \ tests against the isolated hosted CI PostgreSQL only when KEMIRIX_CI_POSTGRES=1\
  \ and GITHUB_ACTIONS=true (never against any development or production database)."
- Only allowed paths change; psycopg[binary] is the only new dependency; no SQLAlchemy,
  Alembic or other frameworks; no Evidence or Rule DDL; 002 and 003 stay non-executable
  pending placeholders.
