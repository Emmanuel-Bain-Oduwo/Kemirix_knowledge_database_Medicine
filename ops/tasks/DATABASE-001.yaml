goal: "Build the simple Psycopg 3 database layer and deterministic migration runner\
  \ (owner directive 2026-09-09, Phase 5 / DATABASE-001): add only psycopg[binary]\
  \ (never SQLAlchemy/Alembic); src/database/connection.py with credentials only from\
  \ approved secrets or environment, TLS required by default (secure sslmodes only;\
  \ an explicit, loudly-named allow_insecure exists solely for the isolated CI service),\
  \ password-bearing DSNs never printed, connect/healthcheck/close with typed errors;\
  \ src/database/transaction.py with the small BEGIN -> work -> COMMIT, exception\
  \ -> ROLLBACK helper so identity creation plus external-ID/containment/name links\
  \ can run atomically; src/database/migrations.py as the single canonical implementation\
  \ of the migration plan (moved from scripts/migration_gate.py), expected-tables\
  \ extraction and the apply-or-verify runner: read repository migration-suite readiness,\
  \ execute only reviewed ready migrations in deterministic order in one transaction,\
  \ support clean PostgreSQL 17 from-zero apply, deterministic idempotent verification\
  \ of the applied prefix, prefix-based multi-migration upgrades, fail closed on partial/foreign/unexpected\
  \ state and never silently skip a required executable migration \u2014 without adding\
  \ a migration-history table to the frozen inventory. scripts/migration_gate.py delegates\
  \ its plan to the library (identical CI behavior) and scripts/runtime.py executes\
  \ development migrations through the release venv runner (stdlib-only runtime.py\
  \ preserved), unlocking the multi-migration development upgrade path while keeping\
  \ every existing fail-closed semantic."
