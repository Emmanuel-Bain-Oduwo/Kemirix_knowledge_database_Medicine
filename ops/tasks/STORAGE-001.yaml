acceptance_criteria:
- 'put_immutable implements the frozen ten-step procedure: local temp file with expected_sha256
  verified by streaming SHA-256 (mismatch rejects the corrupted download), deterministic
  object key validated against the frozen five-segment pattern, HEAD first; absent
  means upload then streaming remote verify; present with the same SHA-256 means idempotent
  success; present with a different hash fails closed and never overwrites; a safe
  sha256 metadata field is stored when supported and the manifest SHA-256 remains
  canonical; existing objects without hash metadata are verified by streaming rather
  than trusting ETag.'
- write_manifest uploads the manifest last, only after every required artifact succeeded,
  at the provenance-derived manifest key, through the frozen hardened Manifest model
  (extra fields forbidden, credential field names rejected, exact artifact object_key
  lineage binding); a failed artifact never leaves a final manifest.
- The client reads bucket/endpoint/region from approved config (config/object_storage.yaml)
  and access credentials only from VM-side environment secrets with canonical names;
  missing credentials fail closed with a safe error naming the variable, never printing
  values; no secret enters logs, exceptions, manifests or reports.
- boto3 is imported lazily inside the runtime client so importing the domain packages
  never loads it and the existing no-external-services boundary test stays green.
- checksum.py provides streaming SHA-256 (and optional MD5 provider checksum) helpers
  used by the client; S3 ETag is never treated as SHA-256.
- 'Unit tests cover: streaming checksum vectors; key safety and __release__; lane/source
  separation; exact manifest lineage; recursive forbidden secret-field names without
  filename substring false positives; missing object then upload; same hash then idempotent;
  different hash then reject; failed artifact then no final manifest; remote verify
  including a tampered object; no secret leakage in errors; all against mocked/stubbed
  S3 with no real data.'
- Only allowed paths change; no Evidence or Rule implementation, no ingestion, no
  parsers, no KMX work, no new architecture beyond boto3, and the frozen keys/manifest/models
  modules are extended rather than rewritten.
required_tests:
