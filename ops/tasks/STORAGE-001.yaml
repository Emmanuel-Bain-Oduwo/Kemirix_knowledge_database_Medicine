  storage contract (owner directive 2026-09-09, Phase 3 / STORAGE-001): add only boto3
  as a dependency; implement src/storage/checksum.py (streaming SHA-256 and optional
  provider MD5 helpers; never use S3 ETag as SHA-256) and src/storage/client.py (S3
  Signature V4 raw-vault client reading endpoint/region/bucket from approved config
  and access credentials only from VM-side secrets; boto3 imported lazily so the domain
  packages stay import-clean) exposing put_immutable (temp file, close, hash, deterministic
  key, HEAD, absent then upload then verify, present with same SHA-256 then idempotent
  success, different hash fails closed and never overwrites, safe sha256 object metadata
  where supported), exists, remote streaming verify and write_manifest last (validated
  through the frozen hardened Manifest model with the provenance lineage binding).
  Secrets never enter Git, logs, manifests or exceptions. Mocked/stubbed S3 tests
  only; no real RxNorm data in the bucket in this task. Object Storage stays the immutable
  raw vault, never the clinical authority.'
