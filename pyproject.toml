[project]
name = "kemirix-knowledge-database-medicine"
version = "0.1.0"
description = "Kemirix medication identity, clinical evidence and deterministic rule foundation"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "httpx>=0.28,<1", "PyYAML>=6,<7", "boto3>=1.34,<2", "psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["integration: isolated engineering integration tests", "contract: future domain contracts"]

[dependency-groups]
dev = ["pytest>=8,<9", "PyYAML>=6,<7", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agents",
    "src/kmx",
    "src/evidence",
    "src/rules",
    "src/storage",
    "src/database",
    "src/sources",
]
